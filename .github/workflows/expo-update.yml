name: Expo OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/expo-update.yml"
  workflow_dispatch:

concurrency:
  group: expo-update-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish production iOS OTA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Publish update
        working-directory: mobile
        run: eas update --platform ios --channel production --environment production --message "main@${{ github.sha }}" --non-interactive
